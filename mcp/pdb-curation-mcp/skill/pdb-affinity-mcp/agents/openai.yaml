interface:
  display_name: "Biomedical Database Curation MCP"
  short_description: "Traceable PDB affinity and general database evidence curation"
  default_prompt: "Use $pdb-affinity-mcp to curate PDB-linked affinity data or build a reusable biomedical metadata registry with coverage gates, provenance and explicit missing-data reasons."

dependencies:
  tools:
    - type: "mcp"
      value: "pdb-curation"
      description: "Local stdio PDB and biomedical database evidence curation MCP"
      transport: "stdio"

policy:
  allow_implicit_invocation: true

